name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 依存を入れる
        run: |
          python -m pip install --upgrade pip
          # 画面の無い環境なので headless 版。torch はテストに要らない
          # （枠を作る部分はキャッシュ済みの輪郭マップだけで動く）
          pip install numpy "opencv-python-headless>=4.8"
      - name: テスト
        run: python -m unittest discover -s tests -v
